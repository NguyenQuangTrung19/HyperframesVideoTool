<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage"
       data-composition-id="news-video"
       data-width="1080"
       data-height="1920"
       data-start="0"
       data-duration="10.60">

    <!-- Shell: persistent brand elements (no data-start → always visible) -->
<div class="shell-bg">
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>
  <div class="glow-orb glow-orb-3"></div>
</div>

<div class="dot-grid-layer"></div>

<div class="particles-layer"><div class="particle" style="width:8px;height:8px;left:73%;background:rgba(16,185,129,0.35);box-shadow:0 0 16px rgba(16,185,129,0.35);animation-duration:13s;animation-delay:8s;"></div><div class="particle" style="width:8px;height:8px;left:70%;background:rgba(196,163,90,0.30);box-shadow:0 0 16px rgba(196,163,90,0.30);animation-duration:12s;animation-delay:2s;"></div><div class="particle" style="width:5px;height:5px;left:96%;background:rgba(5,150,105,0.25);box-shadow:0 0 10px rgba(5,150,105,0.25);animation-duration:22s;animation-delay:2s;"></div><div class="particle" style="width:7px;height:7px;left:87%;background:rgba(255,255,255,0.20);box-shadow:0 0 14px rgba(255,255,255,0.20);animation-duration:13s;animation-delay:1s;"></div><div class="particle" style="width:6px;height:6px;left:1%;background:rgba(16,185,129,0.35);box-shadow:0 0 12px rgba(16,185,129,0.35);animation-duration:24s;animation-delay:1s;"></div><div class="particle" style="width:7px;height:7px;left:37%;background:rgba(196,163,90,0.30);box-shadow:0 0 14px rgba(196,163,90,0.30);animation-duration:11s;animation-delay:10s;"></div><div class="particle" style="width:3px;height:3px;left:81%;background:rgba(5,150,105,0.25);box-shadow:0 0 6px rgba(5,150,105,0.25);animation-duration:10s;animation-delay:3s;"></div><div class="particle" style="width:6px;height:6px;left:9%;background:rgba(255,255,255,0.20);box-shadow:0 0 12px rgba(255,255,255,0.20);animation-duration:19s;animation-delay:11s;"></div><div class="particle" style="width:9px;height:9px;left:39%;background:rgba(16,185,129,0.35);box-shadow:0 0 18px rgba(16,185,129,0.35);animation-duration:12s;animation-delay:11s;"></div><div class="particle" style="width:6px;height:6px;left:33%;background:rgba(196,163,90,0.30);box-shadow:0 0 12px rgba(196,163,90,0.30);animation-duration:19s;animation-delay:10s;"></div><div class="particle" style="width:7px;height:7px;left:66%;background:rgba(5,150,105,0.25);box-shadow:0 0 14px rgba(5,150,105,0.25);animation-duration:20s;animation-delay:2s;"></div><div class="particle" style="width:9px;height:9px;left:40%;background:rgba(255,255,255,0.20);box-shadow:0 0 18px rgba(255,255,255,0.20);animation-duration:22s;animation-delay:2s;"></div><div class="particle" style="width:6px;height:6px;left:54%;background:rgba(16,185,129,0.35);box-shadow:0 0 12px rgba(16,185,129,0.35);animation-duration:10s;animation-delay:3s;"></div><div class="particle" style="width:3px;height:3px;left:42%;background:rgba(196,163,90,0.30);box-shadow:0 0 6px rgba(196,163,90,0.30);animation-duration:16s;animation-delay:9s;"></div><div class="particle" style="width:7px;height:7px;left:14%;background:rgba(5,150,105,0.25);box-shadow:0 0 14px rgba(5,150,105,0.25);animation-duration:16s;animation-delay:10s;"></div><div class="particle" style="width:4px;height:4px;left:61%;background:rgba(255,255,255,0.20);box-shadow:0 0 8px rgba(255,255,255,0.20);animation-duration:19s;animation-delay:6s;"></div><div class="particle" style="width:8px;height:8px;left:18%;background:rgba(16,185,129,0.35);box-shadow:0 0 16px rgba(16,185,129,0.35);animation-duration:12s;animation-delay:12s;"></div><div class="particle" style="width:5px;height:5px;left:61%;background:rgba(196,163,90,0.30);box-shadow:0 0 10px rgba(196,163,90,0.30);animation-duration:17s;animation-delay:1s;"></div><div class="particle" style="width:4px;height:4px;left:75%;background:rgba(5,150,105,0.25);box-shadow:0 0 8px rgba(5,150,105,0.25);animation-duration:20s;animation-delay:11s;"></div><div class="particle" style="width:8px;height:8px;left:36%;background:rgba(255,255,255,0.20);box-shadow:0 0 16px rgba(255,255,255,0.20);animation-duration:16s;animation-delay:5s;"></div></div>

<div class="corner-accent corner-tl"></div>
<div class="corner-accent corner-tr"></div>
<div class="corner-accent corner-bl"></div>
<div class="corner-accent corner-br"></div>

<div class="progress-bar">
  <div class="progress-fill" id="progress-fill"></div>
  <div class="progress-dot" id="progress-dot"></div>
</div>

<div class="brand-shell-header">
  <div class="brand-icon"><img src="tiktok-avatar.jpg" alt="SportsForAllTV" crossorigin="anonymous" /></div>
  <div class="brand-text">
    <div class="brand-name">SportsForAllTV</div>
    <div class="brand-tag">TIN TỨC BÓNG ĐÁ</div>
  </div>
</div>

<div id="grain-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;"><div class="grain-texture"></div></div>

    <audio id="voice"
           class="clip"
           data-start="0"
           data-duration="10.60"
           data-track-index="0"
           src="voice.mp3"></audio>

    <div class="scene clip" id="scene-hook"
     data-start="0.00" data-duration="4.30" data-active="0"
     data-layout="hook">
  <div class="bg gradient-news-dark"></div>
  <div class="bg-grade-overlay"></div>
  <div class="layout-hook">
    <div class="hook-kicker">
      <span class="hook-kicker-bar"></span>
      <span class="hook-kicker-text">Ngoại hạng Anh<small>Vòng 32</small></span>
    </div>
    <div class="hook-bigstat" data-len="3">0-4</div>
    <div class="hook-statbar"></div>
    <div class="hook-headline"><span class="hh-word">Man</span> <span class="hh-word">City</span> <span class="hh-word">sụp</span> <span class="hh-word">đổ</span></div>
    
  </div>
</div>
<div class="scene clip" id="scene-outro"
     data-start="4.30" data-duration="6.30" data-active="0"
     data-layout="outro">
  <div class="layout-outro">
  <div class="out-cta-top">Theo dõi ngay</div>
  <div class="out-channel">SportsForAllTV</div>
  <div class="out-underline"></div>
</div>
<div id="tt-card" class="tt-card">
  <img class="tt-avatar" src="tiktok-avatar.jpg" alt="SportsForAllTV" crossorigin="anonymous" />
  <div class="tt-profile-info">
    <div class="tt-display-name">SportsForAllTV</div>
    <div class="tt-handle">@bonglan0702</div>
    <div class="tt-followers">1.2M followers</div>
  </div>
  <div id="tt-follow-btn" class="tt-follow-btn">
    <span id="tt-btn-follow" class="tt-btn-text">Follow</span>
    <span id="tt-btn-following" class="tt-btn-text tt-btn-text-following">
      <span>Following</span>
      <span class="tt-check-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
    </span>
  </div>
</div>
</div>
  </div>
  <script src="animations.js"></script>
</body>
</html>
